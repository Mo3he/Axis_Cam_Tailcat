---
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

      # Fast gate before the slow SDK build. Upstream tailcat has no API
      # stability promise, so a dependency bump can break compilation; this
      # fails in seconds with a clear message rather than deep in Docker.
      - name: Cross-compile both architectures
        run: |
          tags="$(cat "$(go list -m -f '{{.Dir}}' github.com/tailscale/tailcat)/build-tags.txt"),ts_omit_ssh"
          for target in "arm64:" "arm:7"; do
            arch="${target%%:*}"
            arm="${target##*:}"
            echo "== linux/$arch$([ -n "$arm" ] && echo "v$arm") =="
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOARM="$arm" \
              go build -mod=readonly -trimpath -tags="$tags" -o /dev/null ./daemon
          done

      - name: Build aarch64 and armv7hf packages
        run: ./build.sh

      - name: Verify packages
        run: |
          for package in releases/*.eap; do
            echo "== $package =="
            tar tzf "$package"
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Tailcat-packages
          path: releases/*.eap
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Tailcat-packages
          path: releases

      # Unsigned packages are published first; replace the assets with the
      # signed_*.eap files once the Axis signing service returns them.
      # Marked pre-release while upstream tailcat is pre-1.0 and makes no API,
      # CLI, or wire-format stability promises.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" releases/*.eap \
            --title "Tailcat ${GITHUB_REF_NAME#v}" \
            --prerelease \
            --generate-notes
